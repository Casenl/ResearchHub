# =============================================================================
# CD — Deploy to Staging
# =============================================================================
#
# Triggers after CI passes on the staging branch.
# Deploys Firestore rules, Storage rules, and Cloud Functions to the
# staging Firebase project (marketintelligence-hub-staging).
#
# Required GitHub secret: STAGING_SA_KEY_BASE64
# =============================================================================

name: "CD — Deploy to Staging"

on:
  workflow_run:
    workflows: ["CI — Tests, Types & Build"]
    types: [completed]
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20 with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies (root + functions)
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      # 4. Build Cloud Functions
      - name: Build functions
        run: npm run build --prefix functions

      # 5. Decode service account key
      - name: Decode service account key
        run: echo "${{ secrets.STAGING_SA_KEY_BASE64 }}" | base64 -d > /tmp/sa-key.json

      # 6. Deploy to staging
      - name: Deploy to staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: npx firebase-tools deploy --only firestore:rules,storage,functions --project staging --non-interactive --force

      # 7. Cleanup credentials
      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/sa-key.json
